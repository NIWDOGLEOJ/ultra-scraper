<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maps Email Scraper</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>Maps Email Scraper</h1><p>Find public business emails and phone numbers from Google Maps listings and their websites.</p><form id="form"><label>Google Maps search<input id="query" required placeholder="colleges in Chennai"></label><label>Result limit<input id="limit" type="number" min="1" max="100" value="20" required></label><label>Export businesses with<select id="contactFilter"><option value="both">Emails and phone numbers</option><option value="emails">Emails only</option><option value="phones">Phone numbers only</option></select></label><label class="check"><input id="headed" type="checkbox" checked> Show browser while scraping</label><button>Start Scraping</button></form><section id="status" aria-live="polite">Ready to scrape.</section><section id="downloads" hidden><a id="csv">Download CSV</a><a id="xlsx">Download Excel</a></section></main><script src="/app.js"></script></body></html>
